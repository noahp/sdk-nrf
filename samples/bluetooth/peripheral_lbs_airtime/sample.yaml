sample:
  description: Bluetooth LE LED Button service sample with TX/RX airtime metrics
  name: Bluetooth LE LED Button service with airtime metrics

common:
  build_only: true
  tags:
    - bluetooth

tests:
  sample.bluetooth.peripheral_lbs_airtime:
    build_only: false
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Starting Bluetooth Peripheral LBS sample"
        - "Bluetooth initialized"
        - "Advertising successfully started"
    timeout: 15
