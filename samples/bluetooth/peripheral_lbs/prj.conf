CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_LBS"

# Enable the LBS service
CONFIG_BT_LBS=y
CONFIG_BT_LBS_POLL_BUTTON=y
CONFIG_DK_LIBRARY=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable CBOR encoding for the Memfault Event Service
CONFIG_ZCBOR=y

# Derive the simulated Memfault device serial from the BLE MAC address
CONFIG_HW_ID_LIBRARY=y
CONFIG_HW_ID_LIBRARY_SOURCE_BLE_MAC=y

# Raise the ATT MTU so the Memfault event (including the device info
# strings) fits in a single notification
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Actively request an MTU exchange on connect, since not every central
# initiates one on its own
CONFIG_BT_GATT_CLIENT=y
