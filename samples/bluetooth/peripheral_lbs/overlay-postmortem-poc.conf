#
# PoC overlay: read out the net core's retained-memory postmortem record
# on reset/freeze, via Nordic's Network Core Monitor (NCM).
#
# NCM's app-core-side poll loop (~1s default) needs no new signal from us —
# it already distinguishes a net-core RESET from a net-core FREEZE (wedged,
# never got to reset), which is exactly the case this PoC hit with the RPMSG
# HCI relay. See src/postmortem_monitor.c for the event handler.

CONFIG_NET_CORE_MONITOR=y
