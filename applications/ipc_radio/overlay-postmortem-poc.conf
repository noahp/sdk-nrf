#
# PoC overlay: net-core side of the retained-memory fault relay.
#
# On any fatal error, src/postmortem.c stashes reason/pc/lr/xpsr into a small
# shared-SRAM record (nrf/include/net_core_postmortem.h) with plain volatile
# stores -- no IPC service, no scheduler, no interrupts required. The app
# core reads it back via Nordic's Network Core Monitor, which already gives
# it a RESET-or-FROZEN signal on its own poll loop; no new signal needed.
#
# (An earlier version of this PoC also tried relaying a live HCI
# vendor-specific event over the same RPMSG IPC transport used for normal
# HCI traffic. Dropped: that transport needs cooperative scheduling to
# deliver anything, which a fatal-error handler running with interrupts
# locked can't provide -- it just busy-loops forever instead. The
# retained-memory approach has no such dependency.)
#
# Also adds a debugger-free way to trigger a real fault on demand: the
# `kernel panic` shell command, over RTT (no UART pins needed on the net core).

CONFIG_NET_CORE_MONITOR=y

CONFIG_SHELL=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_KERNEL_SHELL=y
CONFIG_KERNEL_SHELL_PANIC_CMD=y
